# Environnement de développement local : base PostgreSQL + API.
# Prérequis : ./dev/gen-jwt-keys.sh (crée .env.dev). Ne pas utiliser en production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - asr-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file: .env.dev
    environment:
      DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SERVER_PORT: "7670"
    ports:
      - "7670:7670"
    depends_on:
      db:
        condition: service_healthy

volumes:
  asr-dev-db:
