spring.application.name=asr-calculator-api
server.port=${SERVER_PORT:7670}
logging.file.name=logs/app.log
logging.level.fr.asr.calculator=DEBUG

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:test}
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=asr
spring.flyway.create-schemas=true

jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}

spring.boot.admin.client.enabled=false
spring.boot.admin.client.url=https://metrics.killian-dev.fr
management.endpoints.web.exposure.include=*
info.tags.environment=prod
spring.output.ansi.enabled=ALWAYS
logging.pattern.file=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx